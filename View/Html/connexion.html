<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Arena</title>
     <link rel="icon" type="image/png" href="./Image/favicon_royal_arena.png">
     <link rel="stylesheet" href="../Style/connexion.css">
</head>
<body>
        <section class="formulaireconnexion">
  <img src="Image/logo-royal-arena.png" alt="Logo Royal Arena – Football & Padel" id="logo">

  <h2>Connexion</h2>
  <p class="sous-titre">Accéder à mon espace</p>

  <form id="form-connexion" novalidate>
     <div class="champ">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" name="email"
             placeholder="exemple@mail.com"
             autocomplete="email" required
             aria-describedby="erreur-email">
      <p class="erreur" id="erreur-email" role="alert"></p>
    </div>

    <div class="champ">
      <label for="mdp">Mot de passe</label>
      <div class="mdp-wrap">
        <input type="password" id="mdp" name="mdp"
               placeholder="Votre mot de passe"
               autocomplete="current-password" required minlength="8"
               aria-describedby="erreur-mdp">
        <button type="button" id="voir-mdp" aria-label="Afficher le mot de passe">👁</button>
      </div>
      <p class="erreur" id="erreur-mdp" role="alert"></p>
    </div>

    <a class="oublie" href="#">Mot de passe oublié ?</a>

    <button type="submit" class="btn">SE CONNECTER</button>

    <p class="ou">ou</p>

    <div class="reseaux">
      <button type="button" class="btn-outline" disabled>Facebook</button>
      <button type="button" class="btn-outline" disabled>Google</button>
    </div>

    <p class="lien-inscription">
      Pas encore membre ? <a href="inscription.html">Créez un compte</a>
    </p>
  </form>
</section>
</body>
</html>
